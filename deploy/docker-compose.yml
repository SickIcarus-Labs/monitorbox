# MonitorBox: install once; the app and its modules update themselves.
services:
  monitorbox:
    image: ghcr.io/sickicarus-labs/monitorbox:latest
    container_name: monitorbox
    restart: unless-stopped
    network_mode: host            # reaches the devices on your LAN; the web page is on port 8080
    # Only if port 8080 is already used on this machine, uncomment both lines:
    # environment:
    #   MB_PORT: "8090"
    volumes:
      - /Containers/monitorbox:/config   # change the left side to a folder on your machine; everything MonitorBox keeps lives here
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_RAW]            # ping
    security_opt:
      - no-new-privileges:true
